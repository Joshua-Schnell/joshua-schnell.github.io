tagline: I am an anthropological bioarchaeologist studying dentistry, body
  modifications, mortuary ritual, and peri/postmortem processing among the
  precolonial Maya. I am Director of the MayaLAB at the University of Pittsburgh
  and Co-Director of the Proyecto Arqueológico Bajo Lacantún in Chiapas, Mexico.
