# Site settings. Most day-to-day edits happen in the Pages CMS dashboard,
# not here. Change this file only if you know you need to.
title: Joshua T. Schnell
description: Bioarchaeologist of the ancient Maya world. Assistant Professor of Anthropology at the University of Pittsburgh.
url: "https://joshuaschnell.com"
baseurl: ""
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-sitemap

exclude:
  - README.md

# Each project is its own file in the _projects folder,
# with its own page at /projects/file-name/
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Which layout each page uses (so page files only need a title).
defaults:
  - scope: { path: "" }
    values: { layout: page }
  - scope: { path: "index.md" }
    values: { layout: home }
  - scope: { path: "projects.md" }
    values: { layout: projects }
  - scope: { path: "", type: "projects" }
    values: { layout: project }
  - scope: { path: "cv.md" }
    values: { layout: cv }
  - scope: { path: "media.md" }
    values: { layout: media }
  - scope: { path: "teaching.md" }
    values: { layout: teaching }
  - scope: { path: "lab.md" }
    values: { layout: lab }
  - scope: { path: "related.md" }
    values: { layout: related }
  - scope: { path: "contact.md" }
    values: { layout: contact }
